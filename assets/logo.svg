<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 96" width="320" height="96" role="img" aria-label="Lumoxia">
  <defs>
    <linearGradient id="lmx-gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e8c66a"/>
      <stop offset="0.5" stop-color="#c9922f"/>
      <stop offset="1" stop-color="#9c6a1e"/>
    </linearGradient>
    <linearGradient id="lmx-lapis" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2a4a86"/>
      <stop offset="1" stop-color="#16274d"/>
    </linearGradient>
  </defs>

  <!-- Emblem: an eight-point Sumerian rosette (star of Ishtar / Royal Game of Ur rosette) -->
  <g transform="translate(48 48)">
    <circle r="42" fill="url(#lmx-lapis)"/>
    <circle r="42" fill="none" stroke="url(#lmx-gold)" stroke-width="2.5"/>
    <!-- eight petals -->
    <g fill="url(#lmx-gold)">
      <g id="lmx-petal">
        <path d="M0 -34 C 7 -20, 7 -12, 0 -4 C -7 -12, -7 -20, 0 -34 Z"/>
      </g>
      <use href="#lmx-petal" transform="rotate(45)"/>
      <use href="#lmx-petal" transform="rotate(90)"/>
      <use href="#lmx-petal" transform="rotate(135)"/>
      <use href="#lmx-petal" transform="rotate(180)"/>
      <use href="#lmx-petal" transform="rotate(225)"/>
      <use href="#lmx-petal" transform="rotate(270)"/>
      <use href="#lmx-petal" transform="rotate(315)"/>
    </g>
    <circle r="9" fill="#f2e4b8"/>
    <circle r="9" fill="none" stroke="#9c6a1e" stroke-width="1.5"/>
  </g>

  <!-- Wordmark -->
  <text x="104" y="58" font-family="'Cinzel','Trajan Pro',Georgia,serif" font-size="34" letter-spacing="2" fill="#f2e4b8">LUMOXIA</text>
</svg>
