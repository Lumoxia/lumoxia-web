# Checks the translations and the generated pages on every pull request that touches them.
# Standard library only, a few seconds per run.
name: Check translations

on:
  pull_request:
    paths:
      - 'i18n/**'
      - 'templates/**'
      - 'scripts/**'
      - 'styles.css'
      - 'assets/**'
      - 'index.html'
      - 'sitemap.xml'
      - '*/index.html'
      - 'royal-game-of-ur/**'
      - '.github/workflows/check.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python3 scripts/test_check.py
      - run: python3 scripts/check_i18n.py
      - run: python3 scripts/build.py --check
      - run: python3 scripts/test_build.py
